<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Balance It</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/game.css">
  <link rel="stylesheet" href="balance.css">
</head>
<body class="game">
  <header class="topbar">
    <a class="icon-btn" href="../../index.html" aria-label="Home">🏠</a>
    <nav class="levels" id="levels" aria-label="Levels"></nav>
    <div class="topbar-right">
      <button class="icon-btn" id="repeatBtn" aria-label="Say it again">🔊</button>
      <button class="icon-btn small" id="soundBtn" aria-label="Turn sound off">🔈</button>
      <div class="star-count">⭐ 0</div>
    </div>
  </header>

  <main class="stage">
    <section class="prompt">
      <div class="eq" id="eq"></div>
      <div class="bubble" id="bubble" aria-live="polite"></div>
    </section>

    <div class="scale" id="scale">
      <div class="beam-wrap">
        <div class="pan-hang left">
          <div class="pan-items" id="leftItems"></div>
          <div class="plate"></div>
        </div>
        <div class="pan-hang right">
          <div class="pan-items" id="rightItems"></div>
          <div class="plate"></div>
        </div>
        <div class="beam"></div>
        <div class="pivot"></div>
      </div>
      <div class="post"></div>
      <div class="base"></div>
    </div>

    <section class="controls">
      <div class="shelf" id="shelf"></div>
      <section class="choices" id="choices" hidden></section>
      <button class="big-btn next" id="nextBtn" aria-label="Next" hidden>➜</button>
    </section>
  </main>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <div class="mascot">⚖️</div>
      <h1>Balance It</h1>
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
    </div>
  </div>

  <script src="../../js/common/storage.js"></script>
  <script src="../../js/common/catalog.js"></script>
  <script src="../../js/common/progress.js"></script>
  <script src="../../js/common/speech.js"></script>
  <script src="../../js/common/sounds.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/game.js"></script>
  <script src="balance.js"></script>
</body>
</html>
