<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Rhyme Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="../../css/game.css">
  <link rel="stylesheet" href="../../css/reading.css">
  <link rel="stylesheet" href="rhyme.css">
</head>
<body class="game reading">
  <header class="topbar">
    <a class="icon-btn" href="../../index.html" aria-label="Home">🏠</a>
    <nav class="levels" id="levels" aria-label="Levels"></nav>
    <div class="topbar-right">
      <button class="icon-btn" id="repeatBtn" aria-label="Say it again">🔊</button>
      <button class="icon-btn small" id="soundBtn" aria-label="Turn sound off">🔈</button>
      <div class="star-count">⭐ 0</div>
    </div>
  </header>

  <main class="stage">
    <section class="rhyme-top" id="top"></section>
    <div class="bubble" id="bubble" aria-live="polite"></div>
    <section class="rhyme-options" id="options"></section>
    <button class="big-btn next" id="nextBtn" aria-label="Next" hidden>➜</button>
  </main>

  <div class="overlay" id="startOverlay">
    <div class="overlay-card">
      <div class="mascot">🎵</div>
      <h1>Rhyme Time</h1>
      <button class="play-btn" id="playBtn" aria-label="Play">▶</button>
    </div>
  </div>

  <script src="../../js/common/storage.js"></script>
  <script src="../../js/common/catalog.js"></script>
  <script src="../../js/common/progress.js"></script>
  <script src="../../js/common/speech.js"></script>
  <script src="../../js/common/sounds.js"></script>
  <script src="../../js/common/ui.js"></script>
  <script src="../../js/common/game.js"></script>
  <script src="../../js/common/reading-data.js"></script>
  <script src="rhyme.js"></script>
</body>
</html>
